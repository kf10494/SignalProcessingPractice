# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: Build, Test and Lint for the desktop application on Linux.

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  prepare:
    # ジョブは互いに独立した VM で実行されるため, 後続の各ジョブでも Qt の
    # インストールをやり直す必要がある. このジョブは Qt のキャッシュ (cache: true)
    # を温めておくことで, 後続ジョブでのインストールを高速化する目的で存在する.
    runs-on: ubuntu-latest

    steps:
    - name: "[prepare] Checkout"
      uses: actions/checkout@v4

    - name: "[prepare] Install Qt"
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        host: linux
        target: desktop
        dir: '${{ github.workspace }}/qt/'
        install-deps: true
        modules: qtmultimedia
        tools: 'tools_qtcreator,qt.tools.qtcreator'
        cache: true

  build:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
    - name: "[build] Checkout"
      uses: actions/checkout@v4

    - name: "[build] Install Qt"
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        host: linux
        target: desktop
        dir: '${{ github.workspace }}/qt/'
        install-deps: true
        modules: qtmultimedia
        tools: 'tools_qtcreator,qt.tools.qtcreator'
        cache: true

    - name: "[build] Use matching clang toolchain"
      # ubuntu-latest には複数バージョンの clang が入っているため,
      # ビルドで使う clang (18.x) と揃えた run-clang-tidy を確実に使う.
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tools-18
        echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

    - name: "[build] Configure CMake"
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run:  |
        cmake --preset app-linux \
         -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: "[build] Build"
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build/app-linux --config ${{env.BUILD_TYPE}}

    - name: "[build] Materialize ONNX Runtime shared library"
      # テストバイナリは libonnxruntime.so.1 (soname) に依存する. これはシンボリック
      # リンクのため後続の "Remove symlinks" で消える. 実体をコピーして残す.
      run: |
        d=build/app-linux/_deps/onnxruntime-src/lib
        if [ -f "$d/libonnxruntime.so.1.20.1" ]; then
          cp --remove-destination "$d/libonnxruntime.so.1.20.1" "$d/libonnxruntime.so.1"
        fi

    - name: "[build] Remove symlinks under _deps"
      # _deps 配下 (FetchContent で取得したサードパーティ) に循環したシンボリック
      # リンクが生成されており, actions/upload-artifact がこれを辿ろうとして
      # ELOOP で失敗する. lint ジョブが参照する compile_commands.json はビルド
      # ルート直下の実ファイルであり, _deps 配下のリンクは不要なため削除する.
      # (find -type l は lstat ベースでシンボリックリンクを辿らないため安全.)
      run: find build/app-linux/_deps -type l -delete

    - name: "[build] Upload build directory"
      # test / lint ジョブは別 VM で動くため, ビルド成果物 (バイナリと
      # compile_commands.json) を artifact 経由で引き渡す.
      uses: actions/upload-artifact@v4
      with:
        name: app-linux-build
        path: build/app-linux
        retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: "[test] Install Qt"
      # テストバイナリが Qt6::Core / Qt6::Multimedia の共有ライブラリに
      # 実行時リンクするため, Qt のインストールが必要 (バイナリ本体は build
      # ジョブの artifact から取得する).
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        host: linux
        target: desktop
        dir: '${{ github.workspace }}/qt/'
        install-deps: true
        modules: qtmultimedia
        tools: 'tools_qtcreator,qt.tools.qtcreator'
        cache: true

    - name: "[test] Download build directory"
      uses: actions/download-artifact@v4
      with:
        name: app-linux-build
        path: build/app-linux

    - name: "[test] Restore executable permission"
      # actions/upload-artifact は zip 化の際にファイルのパーミッションを保持しない
      # (全ファイルが 644 になる) ため, ダウンロード後にテストバイナリの実行権限を
      # 復元する.
      run: chmod -R +x build/app-linux

    - name: "[test] Test"
      working-directory: ${{github.workspace}}/build/app-linux
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}}

  lint:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: "[lint] Checkout"
      uses: actions/checkout@v4

    - name: "[lint] Install Qt"
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        host: linux
        target: desktop
        dir: '${{ github.workspace }}/qt/'
        install-deps: true
        modules: qtmultimedia
        tools: 'tools_qtcreator,qt.tools.qtcreator'
        cache: true

    - name: "[lint] Use matching clang toolchain"
      # ubuntu-latest には複数バージョンの clang が入っているため,
      # ビルドで使う clang (18.x) と揃えた run-clang-tidy を確実に使う.
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tools-18
        echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

    - name: "[lint] Download build directory"
      # clang-tidy が参照する compile_commands.json を build ジョブの
      # artifact から取得する.
      uses: actions/download-artifact@v4
      with:
        name: app-linux-build
        path: build/app-linux

    - name: "[lint] Determine diff base"
      # pull_request イベントには base.ref があるのでそれを使う.
      # push イベントには pull_request コンテキストが無いため, プッシュ前の
      # コミット (github.event.before) を使う. 新規ブランチの初回プッシュ等で
      # before が解決できない場合は, 差分検査をあきらめて全件検査にフォールバックする
      # (スクリプト側は --diff-base に空文字を渡すと全件検査になる).
      id: diff_base
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          base="origin/${{ github.event.pull_request.base.ref }}"
        else
          base="${{ github.event.before }}"
        fi

        if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
          echo "diff base '$base' is not resolvable; falling back to full scan"
          base=""
        fi

        echo "base=$base" >> "$GITHUB_OUTPUT"

    - name: "[lint] clang-format (diff only)"
      working-directory: scripts
      run: python3 run_clang_format.py --check --diff-base "${{ steps.diff_base.outputs.base }}"

    - name: "[lint] clang-tidy (diff only)"
      working-directory: scripts
      run: python3 run_clang_tidy.py --build-dir ${{github.workspace}}/build/app-linux --diff-base "${{ steps.diff_base.outputs.base }}"
